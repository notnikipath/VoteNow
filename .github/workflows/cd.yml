name: VoteNow CD
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - survey-service
          - response-service
          - verification-service
          - analytics-service
          - export-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: votenow/${{ matrix.service }}:latest
